[workspace]
members = [
    "nekocode-core",
    "nekocode"
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
clap = { version = "4.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
nekocode-core = { path = "nekocode-core", version = "1.2.0" }

# Build optimizations for all workspace members
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
