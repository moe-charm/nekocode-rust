[package]
name = "nekocode"
version = "1.2.0"
edition = "2021"
description = "Canonical Rust-first snapshot and context CLI"
autolib = false

[[bin]]
name = "nekocode"
path = "src/main.rs"

[dependencies]
nekocode-core = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
tempfile = "3.8"
