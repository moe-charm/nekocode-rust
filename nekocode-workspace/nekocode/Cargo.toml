[package]
name = "nekocode"
version = "1.2.0"
edition = "2021"
rust-version = "1.85"
description = "Canonical Rust-first snapshot and context CLI"
authors = ["NekoCode Team"]
license = "MIT"
repository = "https://github.com/moe-charm/nekocode-rust"
readme = "README.md"
autolib = false

[[bin]]
name = "nekocode"
path = "src/main.rs"

[dependencies]
nekocode-core = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
tempfile = "3.8"
