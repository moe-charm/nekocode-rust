[package]
name = "nekocode-core"
version = "1.2.0"
edition = "2021"
description = "Rust-first evidence-backed snapshot and code context core"
authors = ["NekoCode Team"]
license = "MIT"

[features]
default = []
# Recovery-only API used by the frozen multi-binary implementation. Canonical
# snapshot/context consumers must not enable this feature.
legacy = [
    "dep:anyhow",
    "dep:async-trait",
    "dep:dirs",
    "dep:log",
    "dep:num_cpus",
    "dep:regex",
    "dep:rusqlite",
    "dep:tokio",
    "dep:uuid",
    "dep:walkdir",
]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
sha2 = "0.10"
libc = "0.2"

# Frozen session/refactor support. These do not enter the default dependency
# graph and exist only until the physical legacy archive is complete.
anyhow = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
dirs = { version = "5.0", optional = true }
log = { workspace = true, optional = true }
num_cpus = { version = "1.16", optional = true }
regex = { workspace = true, optional = true }
rusqlite = { version = "0.29", features = ["bundled", "chrono"], optional = true }
tokio = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.8"
