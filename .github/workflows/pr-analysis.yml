# 🚀 NekoCode PR Impact Analysis
# Analyzes code changes in pull requests and posts detailed impact reports

name: 🔍 PR Code Impact Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'lib/**'
      - 'components/**'
      - '*.js'
      - '*.ts'
      - '*.jsx'
      - '*.tsx'
      - '*.py'
      - '*.cpp'
      - '*.c'
      - '*.h'
      - '*.hpp'
      - '*.cs'
      - '*.go'
      - '*.rs'

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze-impact:
    runs-on: ubuntu-latest
    name: 🐱 NekoCode Impact Analysis
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for better analysis
          
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Impact Diff (session-first)
        id: analysis
        env:
          INCLUDE_WORKING: "false"
        run: |
          chmod +x scripts/impact-diff.sh || true
          scripts/impact-diff.sh "origin/${{ github.base_ref }}" impact_report.md
          if [ -f "impact_report.md" ]; then
            echo "report_generated=true" >> $GITHUB_OUTPUT
          else
            echo "report_generated=false" >> $GITHUB_OUTPUT
          fi
          
      - name: 📝 Post Analysis Results (disabled; replaced by Impact Diff workflow)
        if: false
        uses: actions/github-script@v7
        with:
          script: |
            // Disabled in favor of .github/workflows/impact-diff.yml upsert comment
            
      - name: 📊 Upload Analysis Artifacts
        if: steps.analysis.outputs.report_generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nekocode-impact-analysis
          path: impact_report.md
          retention-days: 30
          
      - name: ❌ Handle Analysis Failure
        if: steps.analysis.outputs.report_generated == 'false'
        run: |
          echo "⚠️ NekoCode analysis failed or produced no output"
          echo "This might be normal for PRs with no relevant code changes"
          exit 0
