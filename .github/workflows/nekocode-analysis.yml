name: NekoCode PR Impact Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]

jobs:
  nekocode-analysis:
    runs-on: ubuntu-latest
    name: Code Impact Analysis
    
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Impact Diff (session-first)
        env:
          INCLUDE_WORKING: "false"
        run: |
          chmod +x scripts/impact-diff.sh || true
          scripts/impact-diff.sh "origin/${{ github.base_ref }}" impact_report.md

      - name: Comment PR with Impact Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if command -v gh >/dev/null 2>&1; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file impact_report.md || true
          else
            BODY=$(jq -Rs . < impact_report.md)
            curl -sS -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -X POST \
              -d "{\"body\": $BODY}" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" || true
          fi
