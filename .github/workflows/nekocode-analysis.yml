name: Legacy NekoCode PR Impact Analysis (manual)

on:
  workflow_dispatch:

jobs:
  nekocode-analysis:
    runs-on: ubuntu-latest
    name: Code Impact Analysis
    
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Download NekoCode
        run: |
          mkdir -p bin
          curl -L https://github.com/moe-charm/nekocode-rust/raw/master/releases/nekocode-rust -o bin/nekocode-rust
          chmod +x bin/nekocode-rust
          
          # バイナリダウンロード確認
          if [ ! -x bin/nekocode-rust ]; then
            echo "❌ Failed to download nekocode-rust binary!"
            exit 1
          fi
          echo "✅ NekoCode binary downloaded successfully"

      - name: Analyze Current PR
        id: analyze-pr
        run: |
          echo "🔍 Analyzing PR changes..."
          
          # 🎯 全ディレクトリを分析対象に
          ./bin/nekocode-rust analyze . --stats-only > pr_analysis.txt 2>&1
          
          # 🎯 エラー処理
          if [ $? -ne 0 ]; then
            echo "❌ NekoCode analysis failed!"
            cat pr_analysis.txt
            exit 1
          fi
          
          echo "📊 Analysis Results:"
          cat pr_analysis.txt
          
          # 🎯 結果抽出（Rust版の出力形式に対応）
          FILES_COUNT=$(grep -E "📄 総ファイル数: [0-9]+" pr_analysis.txt | grep -oE "[0-9]+" || echo "0")
          ANALYSIS_TIME=$(grep -E "🏁.*took: [0-9.]+s" pr_analysis.txt | grep -oE "[0-9.]+s" || echo "N/A")
          LANGUAGES=$(grep -A 10 "🗂️ \*\*言語別:" pr_analysis.txt | grep -E "• \w+:" | wc -l || echo "1")
          
          # デバッグ情報  
          echo "Extracted values:"
          echo "FILES_COUNT=$FILES_COUNT"
          echo "ANALYSIS_TIME=$ANALYSIS_TIME"
          echo "LANGUAGES=$LANGUAGES"
          
          echo "files_analyzed=$FILES_COUNT" >> $GITHUB_OUTPUT
          echo "analysis_time=$ANALYSIS_TIME" >> $GITHUB_OUTPUT
          echo "languages_detected=$LANGUAGES" >> $GITHUB_OUTPUT

      - name: Generate Impact Report
        run: |
          PR_FILES=${{ steps.analyze-pr.outputs.files_analyzed }}
          ANALYSIS_TIME=${{ steps.analyze-pr.outputs.analysis_time }}
          LANGUAGES_COUNT=${{ steps.analyze-pr.outputs.languages_detected }}
          
          cat > impact_report.md << EOF
          ## 🦀 NekoCode 分析レポート
          
          ### 📊 コードの影響の概要
          
          | メトリック | 価値 |
          |-----------|------|
          | **分析対象** | $(basename "$GITHUB_WORKSPACE") ディレクトリ全体 |
          | **分析されたファイル** | ${PR_FILES} ファイル |
          | **分析時間** | ${ANALYSIS_TIME} |
          | **検出された言語** | ${LANGUAGES_COUNT}言語 |
          
          ### ✅ 分析ステータス
          
          - **コード品質**: NekoCode分析が正常完了
          - **パフォーマンス**: 分析時間 ${ANALYSIS_TIME}
          - **互換性**: 検出されたファイルがエラーなしで処理完了
          
          ---
          *🚀 [NekoCode](https://github.com/moe-charm/nekocode-rust)による分析*
          EOF

      - name: Comment PR (disabled; replaced by Impact Diff workflow)
        if: false
        uses: actions/github-script@v7
        with:
          script: |
            // Disabled in favor of .github/workflows/impact-diff.yml upsert comment
