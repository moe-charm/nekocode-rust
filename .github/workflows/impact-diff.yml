name: Impact Diff

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  impact:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch base ref
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

      - name: Impact diff (generate markdown)
        env:
          INCLUDE_WORKING: "false"
        run: |
          chmod +x scripts/impact-diff.sh || true
          scripts/impact-diff.sh "origin/${{ github.base_ref }}" impact.md

      - name: Upsert PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- impact-diff -->';
            const body = fs.readFileSync('impact.md', 'utf8');
            const content = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: content,
              });
              core.info('Updated existing impact-diff comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: content,
              });
              core.info('Created new impact-diff comment');
            }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: impact-diff
          path: impact.md

