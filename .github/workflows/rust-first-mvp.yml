name: Rust-first MVP

on:
  push:
    branches: [master, main]
    paths:
      - 'nekocode-workspace/nekocode-core/**'
      - 'nekocode-workspace/nekocode/**'
      - 'nekocode-workspace/Cargo.toml'
      - 'nekocode-workspace/Cargo.lock'
      - 'mcp-nekocode-server/mcp_server_rust_first.py'
      - 'mcp-nekocode-server/README_RUST_FIRST.md'
      - 'mcp-nekocode-server/tests/**'
      - 'skills/**'
      - 'schemas/**'
      - 'docs/**'
      - 'README.md'
      - 'scripts/update_rust_first_release.sh'
      - 'releases/setup.py'
      - 'Makefile'
      - 'nekocode-workspace/build.sh'
      - 'nekocode-workspace/build-and-deploy.sh'
      - 'Dockerfile.rust-first'
      - '.dockerignore'
      - '.github/workflows/rust-first-mvp.yml'
  pull_request:
    paths:
      - 'nekocode-workspace/nekocode-core/**'
      - 'nekocode-workspace/nekocode/**'
      - 'nekocode-workspace/Cargo.toml'
      - 'nekocode-workspace/Cargo.lock'
      - 'mcp-nekocode-server/mcp_server_rust_first.py'
      - 'mcp-nekocode-server/README_RUST_FIRST.md'
      - 'mcp-nekocode-server/tests/**'
      - 'skills/**'
      - 'schemas/**'
      - 'docs/**'
      - 'README.md'
      - 'scripts/update_rust_first_release.sh'
      - 'releases/setup.py'
      - 'Makefile'
      - 'nekocode-workspace/build.sh'
      - 'nekocode-workspace/build-and-deploy.sh'
      - 'Dockerfile.rust-first'
      - '.dockerignore'
      - '.github/workflows/rust-first-mvp.yml'

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: nekocode-workspace

jobs:
  verify:
    name: Verify Rust-first context MVP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test context library
        run: cargo test -p nekocode-core

      - name: Verify trusted-workspace execution boundary
        run: cargo test -p nekocode-core --test execution_trust_integration

      - name: Verify procedural-macro execution evidence
        run: cargo test -p nekocode-core --test proc_macro_execution_integration

      - name: Verify Git helper isolation
        run: cargo test -p nekocode-core --test git_helper_safety_integration

      - name: Check canonical CLI package
        run: cargo check -p nekocode --all-targets

      - name: Verify the canonical CLI exposes only two use cases
        run: |
          cargo run -q -p nekocode -- --help > /tmp/nekocode-help.txt
          grep -Eq '^  snapshot  ' /tmp/nekocode-help.txt
          grep -Eq '^  context   ' /tmp/nekocode-help.txt
          ! grep -Eq '^  (session-|deadcode|refactor|impact|watch)' /tmp/nekocode-help.txt

      - name: Smoke-test Rust snapshot output
        run: cargo run -q -p nekocode -- snapshot . --output /tmp/nekocode-rust-snapshot.json && test -s /tmp/nekocode-rust-snapshot.json

      - name: Smoke-test bounded Git context output
        run: cargo run -q -p nekocode -- context . --compare-ref HEAD^ --budget 2000 --diagnostics > /tmp/nekocode-rust-context.json && test -s /tmp/nekocode-rust-context.json

      - name: Smoke-test Rust-first MCP gateway
        working-directory: .
        run: python3 -m unittest discover -s mcp-nekocode-server/tests -p 'test_*.py'

      - name: Check Rust-first Codex skill
        working-directory: .
        run: test -s skills/nekocode-rust-context/SKILL.md && ! grep -Fq '[TODO' skills/nekocode-rust-context/SKILL.md

      - name: Check Rust-first distribution helpers
        working-directory: .
        run: |
          bash -n scripts/update_rust_first_release.sh
          bash -n nekocode-workspace/build.sh nekocode-workspace/build-and-deploy.sh
          python3 -m py_compile releases/setup.py
          make -n build test release install rust-first-release rust-first-install
